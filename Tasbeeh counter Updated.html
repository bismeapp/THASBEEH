<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000D08">
<title>BISME RADIO – Tasbeeh Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Optional: put the KFGQPC Uthmanic Hafs font file next to this HTML, renamed to uthmanic-hafs.ttf */
@font-face{
  font-family:"KFGQPC Uthmanic Script HAFS";
  src:local("KFGQPC Uthmanic Script HAFS"),local("KFGQPC HAFS Uthmanic Script"),url("uthmanic-hafs.ttf") format("truetype");
  font-display:swap;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{
  --g-primary:#006044;--g-sec:#004B38;--g-dark:#003A2C;
  --gold-l:#F5D078;--gold:#E6C66B;--gold-m:#C49A45;--gold-d:#A77A2E;
  --tx:#F5F5EE;--tx2:#D0DAD4;--tx3:#AEBDB5;--tx-gold:#12382B;
  --bd-gold:rgba(230,198,107,.35);--bd-w:rgba(255,255,255,.12);
  --gold-grad:linear-gradient(135deg,#A77A2E,#E6C66B,#F5D078);
  --nav-h:clamp(48px,7.5vh,58px);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --ar:"KFGQPC Uthmanic Script HAFS","KFGQPC HAFS Uthmanic Script","Amiri Quran","Scheherazade New","Noto Naskh Arabic","Droid Arabic Naskh","Geeza Pro","Traditional Arabic",serif;
  --latin:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{
  font-family:Helvetica,"Helvetica Neue",Arial,"Noto Sans Tamil","Noto Sans Malayalam",sans-serif;
  color:var(--tx);background-color:#00291F;
  background-image:linear-gradient(160deg,#001E17 0%,#00291F 50%,#003B2D 100%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;
}
input{-webkit-user-select:text;user-select:text}
button,input{font-family:inherit}

/* ---------- Layout ---------- */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding-bottom:calc(var(--nav-h) + var(--sab))}
.top{
  width:min(1240px,100%);align-self:center;display:flex;align-items:center;justify-content:center;
  padding:calc(clamp(3px,.8vh,8px) + var(--sat)) max(clamp(14px,3vw,32px),var(--sar)) 0 max(clamp(14px,3vw,32px),var(--sal));
}
.title{
  margin:0;text-align:center;
  font-family:"Manrope","Segoe UI",Arial,sans-serif;
  font-size:clamp(23px,3vh + 1vw,33px);
  font-weight:800;line-height:1.18;letter-spacing:.035em;
  color:var(--tx);
  background:linear-gradient(180deg,#FFF9E8 0%,#F5D078 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 2px 14px rgba(230,198,107,.12);
}
.title::after{
  content:"";display:block;width:42px;height:2px;
  margin:5px auto 0;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.main{
  flex:1;min-height:0;width:min(1240px,100%);align-self:center;display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(10px,2vw,26px);
  padding:clamp(4px,.9vh,10px) max(clamp(12px,3vw,32px),var(--sar)) clamp(4px,.9vh,10px) max(clamp(12px,3vw,32px),var(--sal));
}
.card{border-radius:clamp(18px,2.4vw,26px);border:1px solid var(--bd-w);box-shadow:0 14px 36px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05);min-height:0;min-width:0}
.info{background:linear-gradient(160deg,rgba(0,96,68,.26),rgba(0,59,45,.5));display:flex;padding:clamp(14px,3vh,30px);overflow:auto;text-align:center}
.info-inner{margin:auto;width:100%}
.d-ar{font-family:var(--ar);font-weight:400;color:var(--tx);line-height:1.9;font-size:clamp(30px,min(5.2vw,8vh),66px)}
.d-tr{margin-top:clamp(6px,1.4vh,14px);color:var(--gold);font-weight:600;line-height:1.55;font-size:clamp(15px,1.2vw + 1.2vh,22px)}
.d-mean{margin:clamp(8px,1.6vh,16px) auto 0;max-width:36ch;color:var(--tx2);line-height:1.55;font-size:clamp(13px,.9vw + 1vh,18px)}

.counter{
  position:relative;display:flex;flex-direction:column;gap:clamp(6px,1.2vh,12px);overflow:hidden;
  padding:clamp(10px,1.8vh,20px);border-color:var(--bd-gold);background:linear-gradient(165deg,#003A2C,#00291F 90%);
}
.counter::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;border:1.5px solid var(--gold-l);opacity:0}
.counter.glow::after{animation:ringGlow 2s ease-out}
.done-msg{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:5;pointer-events:none;opacity:0;
  max-width:92%;text-align:center;padding:9px 20px;border-radius:18px;background:var(--gold-grad);color:var(--tx-gold);
  font-weight:700;font-size:clamp(14px,1.6vh + .5vw,19px);line-height:1.35;box-shadow:0 10px 28px rgba(0,0,0,.4);
}
.done-msg.show{animation:msgShow 2.2s ease forwards}
.stage{flex:1;min-height:0;position:relative;container-type:size}
.progress-meta{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:clamp(12px,1.9vh,14px);color:var(--tx3)}
.progress-meta b{color:var(--gold);font-weight:700}
.bar{height:6px;border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:var(--gold-grad);transition:width .25s ease}

/* ---------- String Tasbeeh (3D) ---------- */
.ts{position:absolute;inset:0;width:100%;height:100%;display:block}
[data-tap]{cursor:pointer}
.gold-bead{transform-box:fill-box;transform-origin:center}
.gold-bead.press{animation:beadPress .22s ease}
.ring-num{fill:#fff;font-weight:800;pointer-events:none;font-family:var(--latin);transform-box:fill-box;transform-origin:center}
.ring-num.pop{animation:numPop .24s ease}

.seg.on{fill:#12170f;filter:drop-shadow(1px 1.6px .8px rgba(0,0,0,.3))}
.seg.ghost{fill:rgba(30,45,25,.12)}
.seg.off{fill:rgba(30,45,25,.07)}
.lcd.pop .lcd-svg{animation:numPop .2s ease}
.dev-reset,.bigbtn{position:absolute;aspect-ratio:1;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;transition:background .1s ease,transform .1s ease}
.dev-reset{left:66.8%;top:49.8%;width:15.9%}
.bigbtn{left:28.9%;top:58.4%;width:40.9%}
.dev-reset:active,.bigbtn:active,.bigbtn.pulse{background:radial-gradient(circle,rgba(0,0,0,.28) 55%,rgba(0,0,0,.08) 100%);transform:scale(.97)}

/* ---------- Bottom navigation ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;
  height:calc(var(--nav-h) + var(--sab));padding:0 var(--sar) var(--sab) var(--sal);
  background:linear-gradient(180deg,rgba(0,30,23,.92),rgba(0,30,23,.98));
  border-top:1px solid var(--bd-w);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.nav-inner{width:min(720px,100%);height:var(--nav-h);display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.nav button{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:0;padding:3px 2px;color:var(--tx2);cursor:pointer;font-size:clamp(9.5px,2.6vw,12.5px);
}
.nav .ico{width:clamp(20px,3.2vh,24px);height:clamp(20px,3.2vh,24px);color:var(--gold);transition:transform .15s}
.nav .ico svg{width:100%;height:100%;display:block}
.nav .lbl{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.nav button:active .ico{transform:scale(.9)}
.nav button.active .lbl{color:var(--gold-l)}
.nav button.active::before{content:"";position:absolute;top:0;width:24px;height:2px;border-radius:2px;background:var(--gold)}

/* ---------- Sheets & dialogs ---------- */
.overlay{position:fixed;left:0;right:0;top:0;bottom:calc(var(--nav-h) + var(--sab));z-index:40;background:rgba(0,10,8,.55);animation:fadeIn .2s ease}
.sheet{
  position:fixed;z-index:50;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 24px));
  bottom:calc(var(--nav-h) + var(--sab) + 10px);
  max-height:calc(100vh - var(--nav-h) - var(--sab) - var(--sat) - 24px);
  max-height:calc(100dvh - var(--nav-h) - var(--sab) - var(--sat) - 24px);
  display:flex;flex-direction:column;background:linear-gradient(170deg,#003B2D,#00291F);
  border:1px solid var(--bd-w);border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:sheetIn .25s ease;
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px 20px}
.sheet-head h2{margin:0;font-size:17px;font-weight:700}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd-w);background:transparent;color:var(--tx2);display:grid;place-items:center;cursor:pointer}
.x svg{width:18px;height:18px}
.sheet-body{padding:4px 16px 18px;overflow:auto;min-height:0}
.dhikr-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.dhikr-item{
  width:100%;display:flex;flex-direction:column;gap:2px;text-align:center;padding:12px 14px;border-radius:16px;
  border:1px solid var(--bd-w);background:rgba(0,96,68,.18);color:var(--tx);cursor:pointer;font-size:14px;
}
.dhikr-item.on{border-color:var(--bd-gold);background:rgba(230,198,107,.1)}
.di-ar{font-family:var(--ar);font-weight:400;font-size:26px;line-height:1.8}
.di-tr{color:var(--gold);font-size:14px;line-height:1.5}
.sec{margin-bottom:18px}
.sec:last-child{margin-bottom:0}
.sec-title{font-size:13px;font-weight:600;color:var(--tx3);margin-bottom:8px;letter-spacing:.02em}
.chips{display:flex;gap:8px}
.chip{flex:1 1 0;min-height:46px;border-radius:14px;border:1px solid var(--bd-w);background:rgba(255,255,255,.04);color:var(--tx);font-size:15px;font-weight:700;cursor:pointer}
.chip.on{background:var(--gold-grad);color:var(--tx-gold);border-color:transparent}
.custom{display:flex;gap:8px}
.custom input{flex:1;min-width:0;height:46px;border-radius:14px;border:1px solid var(--bd-w);background:rgba(0,30,23,.6);color:var(--tx);padding:0 14px;font-size:16px;outline:none}
.custom input:focus{border-color:var(--bd-gold)}
.err{min-height:18px;margin-top:6px;font-size:12.5px;color:var(--gold-l)}
.gold-btn{height:46px;padding:0 20px;border:0;border-radius:14px;background:var(--gold-grad);color:var(--tx-gold);font-size:15px;font-weight:700;cursor:pointer}
.ghost-btn{height:46px;padding:0 20px;border-radius:14px;border:1px solid var(--bd-w);background:transparent;color:var(--tx);font-size:15px;font-weight:600;cursor:pointer}
.dialog{
  position:fixed;z-index:55;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,calc(100% - 40px));
  padding:22px;text-align:center;background:linear-gradient(170deg,#003B2D,#00291F);border:1px solid var(--bd-gold);
  border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.55);animation:dlgIn .22s ease;
}
.dialog h2{margin:0 0 8px;font-size:18px}
.dialog p{margin:0;color:var(--tx2);font-size:14.5px;line-height:1.5}
.dlg-actions{display:flex;gap:10px;margin-top:20px}
.dlg-actions button{flex:1;padding:0 10px}
.toast{
  position:fixed;left:50%;z-index:70;bottom:calc(var(--nav-h) + var(--sab) + 14px);transform:translate(-50%,8px);
  max-width:min(90vw,420px);padding:10px 16px;border-radius:14px;background:rgba(0,30,23,.96);border:1px solid var(--bd-gold);
  color:var(--tx);font-size:14px;text-align:center;white-space:pre-line;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Transitions ---------- */
.fx{transition:opacity .14s ease}
.lang-out .fx{opacity:0}
.mode-in{animation:modeIn .3s ease}
.anim-in{animation:infoIn .3s ease}
@keyframes modeIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes infoIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes dlgIn{from{opacity:0;transform:translate(-50%,-48%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes beadPress{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes numPop{0%{transform:scale(.92);opacity:.6}100%{transform:scale(1);opacity:1}}
@keyframes ringGlow{0%{opacity:0;box-shadow:inset 0 0 0 rgba(245,208,120,0)}25%{opacity:.9;box-shadow:inset 0 0 40px rgba(245,208,120,.2)}100%{opacity:0;box-shadow:inset 0 0 0 rgba(245,208,120,0)}}
@keyframes msgShow{0%{opacity:0;transform:translate(-50%,-8px)}10%{opacity:1;transform:translate(-50%,0)}86%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}

/* ---------- Responsive ---------- */
@media (max-width:700px),(orientation:portrait) and (max-width:900px){
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1.4fr)}
  .d-ar{font-size:clamp(22px,3.8vh,36px)}
  .d-tr{font-size:clamp(14px,2.2vh,18px)}
  .d-mean{font-size:clamp(12.5px,1.9vh,16px)}
  .info{padding:clamp(10px,2vh,18px)}
}
@media (max-height:520px){
  :root{--nav-h:46px}
  .title{font-size:18px}
  .nav button{gap:2px;font-size:9.5px}
  .nav .ico{width:18px;height:18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .done-msg.show{animation:none!important;opacity:1}
}

/* ===== Custom colour scheme ===== */
:root{
  --bg:#000D08;
  --panel:#003D2B;
  --box:linear-gradient(180deg,#065032 0%,#011A10 100%);
  --bd-gold:#977529BF;
}
html,body{background-color:#000D08}
body{background-image:none}
.card{border:1px solid #977529BF}
.info,.counter{background:linear-gradient(180deg,#065032 0%,#011A10 100%)}
.nav{
  background:#000D08;
  border-top:1px solid #000D08;
  -webkit-backdrop-filter:none;backdrop-filter:none;
}
.sheet,.dialog{
  background:#003D2B;
  border:1px solid #977529BF;
}
.sheet-head{border-bottom:1px solid #977529BF}
.x{border:1px solid #977529BF}
.dhikr-item{
  background:linear-gradient(180deg,#065032 0%,#011A10 100%);
  border:1px solid #977529BF;
}
.dhikr-item.on{border-color:#E6C66B}
.chip{background:#000D08;border:1px solid #977529BF}
.chip.on{border-color:transparent}
.custom input{background:#000D08;border:1px solid #977529BF}
.custom input:focus{border-color:#E6C66B}
.ghost-btn{border:1px solid #977529BF}
.toast{background:#000D08;border:1px solid #977529BF}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <h1 class="title fx" data-i18n="appTitle">Tasbeeh Counter</h1>
  </header>

  <main class="main">
    <section class="card info" id="infoCard" aria-live="polite">
      <div class="info-inner fx" id="infoInner">
        <div class="d-ar" id="dAr" lang="ar" dir="rtl"></div>
        <div class="d-tr" id="dTr"></div>
        <div class="d-mean" id="dMean"></div>
      </div>
    </section>

    <section class="card counter" id="counterArea">
      <div class="done-msg" id="doneMsg" role="status"></div>
      <div class="stage" id="stage"></div>
      <div class="progress fx">
        <div class="progress-meta"><span id="targetText"></span><span id="countText"></span></div>
        <div class="bar"><i id="barFill"></i></div>
      </div>
    </section>
  </main>
</div>

<nav class="nav" id="nav">
  <div class="nav-inner">
    <button type="button" id="navDhikr"><span class="ico" data-icon="book"></span><span class="lbl fx" data-i18n="navDhikr">Dhikr</span></button>
    <button type="button" id="navCount"><span class="ico" data-icon="hash"></span><span class="lbl fx" data-i18n="navCount">Count</span></button>
    <button type="button" id="navLang"><span class="ico" data-icon="languages"></span><span class="lbl fx" data-i18n="navLang">Language</span></button>
    <button type="button" id="navSound"><span class="ico" id="soundIco"></span><span class="lbl fx" id="soundLbl">Sound</span></button>
    <button type="button" id="navTheme"><span class="ico" data-icon="repeat"></span><span class="lbl fx" data-i18n="navTheme">Theme</span></button>
    <button type="button" id="navReset"><span class="ico" data-icon="reset"></span><span class="lbl fx" data-i18n="navReset">Reset</span></button>
  </div>
</nav>

<div class="overlay" id="overlay" hidden></div>

<section class="sheet" id="dhikrSheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-head">
    <h2 class="fx" data-i18n="selectDhikr">Select Dhikr</h2>
    <button type="button" class="x" data-close data-i18n-aria="close" data-icon="close"></button>
  </div>
  <div class="sheet-body fx"><ul class="dhikr-list" id="dhikrList"></ul></div>
</section>

<section class="sheet" id="countSheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-head">
    <h2 class="fx" data-i18n="countSettings">Count Settings</h2>
    <button type="button" class="x" data-close data-i18n-aria="close" data-icon="close"></button>
  </div>
  <div class="sheet-body fx">
    <div class="sec">
      <div class="sec-title" data-i18n="target">Target</div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="sec">
      <div class="sec-title" data-i18n="customTarget">Custom target</div>
      <div class="custom">
        <input id="customInput" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-i18n-ph="enterNumber" placeholder="Enter a number">
        <button type="button" class="gold-btn" id="setCustom" data-i18n="set">Set</button>
      </div>
      <div class="err" id="customErr" role="alert"></div>
    </div>
  </div>
</section>

<section class="dialog" id="confirmDialog" role="alertdialog" aria-modal="true" hidden>
  <h2 data-i18n="resetTitle">Reset counter?</h2>
  <p data-i18n="resetText">The count will return to 0.</p>
  <div class="dlg-actions">
    <button type="button" class="ghost-btn" id="cancelReset" data-i18n="cancel">Cancel</button>
    <button type="button" class="gold-btn" id="confirmReset" data-i18n="confirmReset">Reset</button>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

   1. DHIKR DATA

const Sound = {
  ctx: null,
  canVibrate: typeof navigator.vibrate === 'function',
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) { try { this.ctx = new AC(); } catch (e) { this.ctx = null; } }
    }
    if (this.ctx && this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} }
    return this.ctx;
  },
  wantsAudio() { return state.sound === 0 || state.sound === 3; },
  wantsVibe() { return state.sound === 2 || state.sound === 3; },
  beep(freq, dur, vol, type, delay) {
    const ctx = this.ensure(); if (!ctx) return;
    const t0 = ctx.currentTime + (delay || 0);
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  },
  vibrate(p) { if (this.canVibrate) { try { navigator.vibrate(0); navigator.vibrate(p); } catch (e) {} } },
  tick() {
    if (this.wantsAudio()) { this.beep(720, 0.06, 0.16, 'triangle'); this.beep(360, 0.08, 0.1, 'sine'); }
    if (this.wantsVibe()) this.vibrate(35);
  },
  done() {
    if (this.wantsAudio()) { this.beep(880, 0.22, 0.18, 'sine'); this.beep(1175, 0.35, 0.16, 'sine', 0.14); }
    if (this.wantsVibe()) this.vibrate([60, 50, 60, 50, 120]);
  }
};

  e: '4,47 8,51 8,83 4,87 0,83 0,51',
  c: '48,47 52,51 52,83 48,87 44,83 44,51'
};
const DIGIT_SEGS = ['abcdef', 'bc', 'abdeg', 'abcdg', 'bcfg', 'acdfg', 'acdefg', 'abc', 'abcdefg', 'abcdfg'];

function lcdSvg(n) {
  const str = String(n);
  const total = Math.max(4, str.length);
  const digits = str.padStart(total, '0');
  const lead = total - str.length;           // leading zeros are drawn faint
  const W = total * 68 - 16;
  let out = '<svg class="lcd-svg" viewBox="0 0 ' + W + ' 92" preserveAspectRatio="xMaxYMid meet" aria-hidden="true">';
  for (let i = 0; i < total; i++) {
    const on = DIGIT_SEGS[+digits[i]];
    const ghost = i < lead;
    out += '<g transform="translate(' + (i * 68) + ' 0)">';
    'abcdefg'.split('').forEach(k => {
      const lit = on.indexOf(k) >= 0;
      out += '<polygon class="seg ' + (lit ? (ghost ? 'ghost' : 'on') : 'off') + '" points="' + SEG[k] + '"/>';
    });
    out += '</g>';
  }
  return out + '</svg>';
}

function digitalMarkup() {
  return '<div class="device" id="device">' +
    '<div class="lcd" id="lcd" role="img"></div>' +
    '<button type="button" class="dev-reset" id="devReset" aria-label="' + t('navReset') + '"></button>' +
    '<button type="button" class="bigbtn" id="bigBtn" data-tap aria-label="' + t('tapToCount') + '"></button>' +
  '</div>';
}

function buildStage() {
  stage.innerHTML = state.mode === 'string' ? stringMarkup() : digitalMarkup();
  ui = {
    svg: $('#tsSvg'), ringNum: $('#ringNum'), goldPos: $('#goldPos'), goldBead: $('#goldBead'),
    lcd: $('#lcd'), bigBtn: $('#bigBtn'), devReset: $('#devReset')
  };
  if (ui.devReset) ui.devReset.addEventListener('click', () => openSheet('confirm'));
  if (ui.goldPos) { cancelAnimationFrame(goldAnim); goldAngle = state.count * STEP; placeGold(goldAngle); }
  updateCountUI(false);
  retrigger(stage, 'mode-in');
}

function updateStageText() {
  if (ui.svg) ui.svg.setAttribute('aria-label', t('beadsLabel'));
  if (ui.bigBtn) ui.bigBtn.setAttribute('aria-label', t('tapToCount'));
  if (ui.devReset) ui.devReset.setAttribute('aria-label', t('navReset'));
  const lbl = $('#devLabel'); if (lbl) lbl.textContent = t('navCount');
}

function placeGold(angle) {
  if (!ui.goldPos) return;
  const p = polar(angle);
  ui.goldPos.setAttribute('transform', 'translate(' + p.x.toFixed(2) + ' ' + p.y.toFixed(2) + ')');
}

/* The gold counting bead travels individually around the string. */
function moveGold(toAngle, animate) {
  if (!ui.goldPos) return;
  cancelAnimationFrame(goldAnim);
  if (!animate || prefersReduced()) { goldAngle = toAngle; placeGold(goldAngle); return; }
  const from = goldAngle, start = performance.now(), dur = 260;
  function step(now) {
    const k = Math.min(1, (now - start) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    goldAngle = from + (toAngle - from) * e;
    placeGold(goldAngle);
    if (k < 1) goldAnim = requestAnimationFrame(step);
  }
  goldAnim = requestAnimationFrame(step);
}

function updateProgress() {
  $('#targetText').textContent = t('target') + ': ' + state.target;
  $('#countText').innerHTML = '<b>' + state.count + '</b> / ' + state.target;
  $('#barFill').style.width = (Counter.progress() * 100).toFixed(1) + '%';
}

function updateCountUI(animate) {
  const str = String(state.count), len = str.length;
  if (state.mode === 'string' && ui.ringNum) {
    ui.ringNum.textContent = str;
    ui.ringNum.setAttribute('font-size', len <= 3 ? 96 : len === 4 ? 78 : len === 5 ? 64 : len === 6 ? 54 : 44);
    if (animate) retrigger(ui.ringNum, 'pop');
    moveGold(state.count * STEP, animate);
  } else if (ui.lcd) {
    ui.lcd.innerHTML = lcdSvg(state.count);
    ui.lcd.setAttribute('aria-label', str);
    if (animate) retrigger(ui.lcd, 'pop');
  }
  updateProgress();
}

/* =====================================================================
   8. DHIKR DISPLAY
   ===================================================================== */
function renderInfo(animate) {
  const d = getDhikr();
  $('#dAr').textContent = d.ar;
  $('#dTr').textContent = d.tr[state.lang];
  $('#dMean').textContent = d.mean[state.lang];
  if (animate) retrigger($('#infoInner'), 'anim-in');
}

function renderDhikrList() {
  const ul = $('#dhikrList');
  ul.innerHTML = '';
  DHIKR.forEach(d => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'dhikr-item' + (d.id === state.dhikrId ? ' on' : '');
    const ar = document.createElement('span'); ar.className = 'di-ar'; ar.lang = 'ar'; ar.dir = 'rtl'; ar.textContent = d.ar;
    const tr = document.createElement('span'); tr.className = 'di-tr'; tr.textContent = d.tr[state.lang];
    b.appendChild(ar); b.appendChild(tr);
    b.addEventListener('click', () => selectDhikr(d.id));
    li.appendChild(b); ul.appendChild(li);
  });
}

function selectDhikr(id) {
  settlePending();
  state.dhikrId = id; Store.save(state);
  renderInfo(true); renderDhikrList(); closeSheets();
}

/* =====================================================================
   9. LANGUAGE / SOUND / MODE
   ===================================================================== */
function renderSoundNav() {
  $('#soundIco').innerHTML = icon(SOUND_ICONS[state.sound]);
  $('#soundLbl').textContent = L().soundShort[state.sound];
  $('#navSound').setAttribute('aria-label', L().soundFull[state.sound]);
}

function applyLanguage() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph'))); });
  $('#doneMsg').textContent = t('completed');
  renderSoundNav(); renderInfo(false); renderDhikrList(); updateProgress(); updateStageText();
}

function cycleLanguage() {
  state.lang = LANGS[(LANGS.indexOf(state.lang) + 1) % LANGS.length];
  Store.save(state);
  document.body.classList.add('lang-out');
  setTimeout(() => {
    applyLanguage();
    document.body.classList.remove('lang-out');
    toast(LANG_NAMES[state.lang]);
  }, 140);
}

function cycleSound() {
  state.sound = (state.sound + 1) % 4;
  Store.save(state);
  renderSoundNav();
  let msg = L().soundFull[state.sound];
  if (Sound.wantsVibe() && !Sound.canVibrate) msg += '\n' + t('noVibrate');
  toast(msg);
  if (Sound.wantsAudio()) Sound.beep(660, 0.09, 0.15, 'triangle');
  if (Sound.wantsVibe()) Sound.vibrate(20);
}

function toggleMode() {
  state.mode = state.mode === 'string' ? 'digital' : 'string';
  Store.save(state);
  buildStage();
  toast(state.mode === 'string' ? t('modeString') : t('modeDigital'));
}

/* =====================================================================
   10. COUNTING ACTIONS  (target reached → message → reset → next Dhikr)
   ===================================================================== */
let advancing = false, advanceTimer = 0;

function pulseTap() {
  if (state.mode === 'string') retrigger(ui.goldBead, 'press');
  else { retrigger(ui.bigBtn, 'pulse'); setTimeout(() => ui.bigBtn && ui.bigBtn.classList.remove('pulse'), 130); }
}

function hideDone() { $('#doneMsg').classList.remove('show'); }

function celebrate() {
  $('#doneMsg').textContent = t('completed');
  retrigger($('#counterArea'), 'glow');
  retrigger($('#doneMsg'), 'show');
}

function completeTarget() {
  advancing = true;
  Sound.done();
  celebrate();
  clearTimeout(advanceTimer);
  advanceTimer = setTimeout(advanceDhikr, ADVANCE_DELAY);
}

function advanceDhikr() {
  advancing = false;
  hideDone();
  Counter.reset();
  const idx = DHIKR.findIndex(d => d.id === state.dhikrId);
  state.dhikrId = DHIKR[(idx + 1) % DHIKR.length].id;   // after #10 → back to #1
  updateCountUI(false);
  renderInfo(true);
  renderDhikrList();
  Store.save(state);
}

/* If the user changes Dhikr / target / resets while the message is showing */
function settlePending() {
  if (!advancing) return;
  clearTimeout(advanceTimer);
  advancing = false;
  hideDone();
  Counter.reset();
  updateCountUI(false);
}

function tap() {
  if (advancing) return;
  Counter.inc();
  const done = Counter.isComplete();
  updateCountUI(true);
  pulseTap();
  Store.save(state);
  if (done) completeTarget(); else Sound.tick();
}

function doReset() {
  settlePending();
  Counter.reset();
  updateCountUI(false);
  Store.save(state);
}

/* =====================================================================
   11. SHEETS, DIALOGS, TOAST, NAVIGATION
   ===================================================================== */
const overlay = $('#overlay');
const sheets = { dhikr: $('#dhikrSheet'), count: $('#countSheet'), confirm: $('#confirmDialog') };
const navFor = { dhikr: $('#navDhikr'), count: $('#navCount') };
let currentSheet = null;

function setNavActive(name) {
  Object.keys(navFor).forEach(k => navFor[k].classList.toggle('active', k === name));
}
function closeSheets() {
  Object.keys(sheets).forEach(k => { sheets[k].hidden = true; });
  overlay.hidden = true; currentSheet = null; setNavActive(null);
}
function openSheet(name) {
  closeSheets();
  if (name === 'count') {
    $('#customInput').value = PRESETS.indexOf(state.target) >= 0 ? '' : String(state.target);
    $('#customErr').textContent = '';
    renderChips();
  }
  if (name === 'dhikr') renderDhikrList();
  overlay.hidden = false; sheets[name].hidden = false; currentSheet = name; setNavActive(name);
}
function toggleSheet(name) { if (currentSheet === name) closeSheets(); else openSheet(name); }

let toastTimer = 0;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

function renderChips() {
  const box = $('#chips'); box.innerHTML = '';
  PRESETS.forEach(n => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip' + (state.target === n ? ' on' : ''); b.textContent = n;
    b.addEventListener('click', () => { setTarget(n); $('#customInput').value = ''; });
    box.appendChild(b);
  });
}
function setTarget(n) {
  settlePending();
  Counter.setTarget(n); Store.save(state);
  $('#customErr').textContent = '';
  renderChips(); updateProgress();
}
function applyCustom() {
  const raw = $('#customInput').value.trim();
  const n = /^\d+$/.test(raw) ? parseInt(raw, 10) : NaN;
  if (!(n >= 1 && n <= MAX_TARGET)) { $('#customErr').textContent = t('invalidTarget'); return; }
  setTarget(n);
  toast(t('target') + ': ' + n);
}

/* =====================================================================
   12. TAP HANDLING  (tap anywhere inside the counter section only)
   ===================================================================== */
const NO_COUNT = 'button,input,textarea,select,a,label,[role="dialog"],[role="alertdialog"],.nav,.sheet,.dialog,.overlay,.toast,[data-notap]';

document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (currentSheet) return;                              // panels / dialogs open: never count
  const target = e.target;
  if (!(target instanceof Element)) return;
  const counterArea = target.closest('#counterArea');
  if (!counterArea) return;                              // never count taps on the Dhikr card, title, nav, or elsewhere
  if (target.closest('[data-tap]')) { tap(); return; }   // beads, string, digital button: count
  if (!target.closest(NO_COUNT)) tap();                  // blank space inside the counter section: count
});
document.addEventListener('click', e => {                // keyboard activation (Enter / Space) on the counting controls
  if (e.detail === 0 && !currentSheet && e.target instanceof Element &&
      e.target.closest('#counterArea') && e.target.closest('[data-tap]')) tap();
});

/* =====================================================================
   13. INITIALISATION
   ===================================================================== */
function init() {
  document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icon(el.getAttribute('data-icon')); });

  $('#navDhikr').addEventListener('click', () => toggleSheet('dhikr'));
  $('#navCount').addEventListener('click', () => toggleSheet('count'));
  $('#navLang').addEventListener('click', cycleLanguage);
  $('#navSound').addEventListener('click', cycleSound);
  $('#navTheme').addEventListener('click', toggleMode);
  $('#navReset').addEventListener('click', () => openSheet('confirm'));

  overlay.addEventListener('click', closeSheets);
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheets));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheets(); });

  $('#cancelReset').addEventListener('click', closeSheets);
  $('#confirmReset').addEventListener('click', () => { doReset(); closeSheets(); });

  $('#setCustom').addEventListener('click', applyCustom);
  $('#customInput').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 9); $('#customErr').textContent = ''; });
  $('#customInput').addEventListener('keydown', e => { if (e.key === 'Enter') applyCustom(); });

  buildStage();
  applyLanguage();
  renderChips();
  Store.save(state);
}
init();

})();
</script>
</body>
